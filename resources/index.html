<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Stylish Home Planner App with Search">
    <title>Home Planner App</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
<header>
    <h1>🏠 Home Planner App</h1>
    <p>Select a room to plan and organize!</p>
    <!-- Search Bar -->
    <div class="search-container">
        <input
                type="text"
                id="search-input"
                placeholder="Search for items (e.g., Earphone, Chair)"
        />
        <button id="search-button">Search</button>
    </div>

    <div class="add-item-form">
        <input type="text" id="item-input" placeholder="Enter item (e.g., Earphone)" />
        <select id="room-select">
            <option value="Living Room">Living Room</option>
            <option value="Dining Room">Dining Room</option>
            <option value="Room 1">Room 1</option>
            <option value="Room 2">Room 2</option>
            <option value="Room 3">Room 3</option>
        </select>
        <button id="add-item-button">Add Item</button>
    </div>

</header>
<main>
    <section class="room-container">
        <!-- Living Room -->
        <div class="room-card" data-items="earphone, sofa, tv" onclick="location.href='living-room.html';">
            <img src="./images/Hall.jpg" alt="Living Room">
            <h2>Living Room</h2>
            <p class="room-items">Items: earphone, sofa, tv</p>
        </div>
        <!-- Dining Room -->
        <div class="room-card" data-items="table, chairs, vase" onclick="location.href='dining-room.html';">
            <img src="./images/Hall.jpg" alt="Dining Room">
            <h2>Dining Room</h2>
            <p class="room-items">Items: table, chairs, vase</p>
        </div>
        <!-- Room 1 -->
        <div class="room-card" data-items="bed, laptop, earphone" onclick="location.href='room1.html';">
            <img src="./images/P.jpg" alt="Room 1">
            <h2>Room 1</h2>
            <p class="room-items">Items: bed, laptop, earphone</p>
        </div>
        <!-- Room 2 -->
        <div class="room-card" data-items="books, desk, lamp" onclick="location.href='room2.html';">
            <img src="./images/P.jpg" alt="Room 2">
            <h2>Room 2</h2>
            <p class="room-items">Items: books, desk, lamp</p>
        </div>
        <!-- Room 3 -->
        <div class="room-card" data-items="wardrobe, mirror, shoes" onclick="location.href='room3.html';">
            <img src="./images/Hall.jpg" alt="Room 3">
            <h2>Room 3</h2>
            <p class="room-items">Items: wardrobe, mirror, shoes</p>
        </div>
    </section>
</main>
<footer>
    <p>&copy; 2024 Home Planner App. All rights reserved.</p>
</footer>
<script src="script.js"></script>
</body>
</html>
